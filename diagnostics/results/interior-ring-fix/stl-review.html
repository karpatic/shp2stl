<script type="module">
import * as THREE from 'three';import {OrbitControls} from '../../../three/OrbitControls.js';
const {modelRing}=await (await fetch('../interior-ring-final-baltimore/regions.json')).json();
const xs=modelRing.map(p=>p[0]),ys=modelRing.map(p=>p[1]);const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
for(const [id,dir] of [['before','hull-after-baltimore'],['after','interior-ring-final-baltimore']]) {
 const buffer=await (await fetch(`../${dir}/scene.stl`)).arrayBuffer(),data=new DataView(buffer),n=data.getUint32(80,true),coords=new Float32Array(n*9);
 for(let i=0;i<n;i++)for(let j=0;j<9;j++)coords[i*9+j]=data.getFloat32(84+50*i+12+j*4,true);
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(coords,3));geometry.computeVertexNormals();
 const scene=new THREE.Scene();scene.background=new THREE.Color('#eef2f2');scene.add(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:'#3e8e92',roughness:.7})));
 scene.add(new THREE.AmbientLight(0xffffff,1.6));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(cx-25,cy-20,60);scene.add(light);
 const el=document.getElementById(id),aspect=el.clientWidth/el.clientHeight,camera=new THREE.OrthographicCamera(-18*aspect,18*aspect,18,-18,.1,1000);
 camera.position.set(cx,cy-21,43);const controls=new OrbitControls(camera,el);controls.target.set(cx,cy,6);controls.update();
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(el.clientWidth,el.clientHeight);el.appendChild(renderer.domElement);
 const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);render();
}
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));document.body.dataset.ready='true';
</script>
