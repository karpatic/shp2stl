<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>shp2stl - Futuristic 3D Converter</title>
    <meta name="description" content="Convert GIS lines/boundaries into a 3D-printable STL model.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #000;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #0ff;
        }
        #canvas-container {
            width: 100%;
            height: 300px;
        }
        .btn-neon {
            background-color: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            background-color: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        .futuristic-image {
            position: relative;
            overflow: hidden;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        .futuristic-image img {
            width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }
        .futuristic-image:hover img {
            transform: scale(1.05);
        }
        .futuristic-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(0,255,255,0.2) 0%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }
        .futuristic-image figcaption {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 0.9rem;
            text-shadow: 0 0 5px #0ff;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-5">shp2stl</h1>
        <div class="row">
            <div class="col-md-6">
                <p>Convert GIS lines/boundaries into a <strong>3D-printable</strong> STL model.</p>
                <p>Not released, yet.</p>
                <p>Try the interactive web app:</p>
                <a class="btn btn-neon mt-3" href="./app.html">Open App</a>
            </div>
            <div class="col-md-6">
                <div id="canvas-container"></div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <figure class="futuristic-image">
                    <img src="https://carlos-a-diez.com/images/shp2stl_1.jpg" alt="Image: shp2stl">
                    <figcaption>Image: 3D printed ShapeFile</figcaption>
                </figure>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Three.js scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(document.getElementById('canvas-container').offsetWidth, 300);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create a simple 3D object (cube)
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 5;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
